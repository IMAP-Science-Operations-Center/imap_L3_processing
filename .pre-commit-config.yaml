ci:
  autofix_prs: false
  autoupdate_schedule: "quarterly"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: |
            (?x)^(
              (instrument_team_data|tests/test_data)/  # data file trees
              | tests/.*\.txt$                         # other test text files
              | .*\.(cdf|csf|csv|dat|tf|tls|ts|tsc)$   # data files anywhere
              | docs/.*\.(svg|png)$                    # documentation images
            )
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.15.2"
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
