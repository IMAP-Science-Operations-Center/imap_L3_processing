  RECORD_VARYING: RV
  DEPEND_0: epoch
  DEPEND_1: electron_energy
  FIELDNAM: A-side Plus Uncertainty
  FORMAT: g9.3
  LABLAXIS: A-side unc.
  UNITS: "#/(cm^2-s-sr-MeV)"
  VALIDMIN: 0
  VALIDMAX: 10000000000
  FILLVAL: -1.0000E+31
  LABL_PTR_1: electron_energy_label
  SCALEMIN: 0.0001
  SCALEMAX: 1000
  SPECIES: electron
