hit_flags:
  NAME: hit_flags
  DATA_TYPE: CDF_UINT2
  CATDESC: "Quality flags for HIT L3 electron (caution required if nonzero)"
  DEPEND_0: epoch
  VAR_TYPE: data
  DISPLAY_TYPE: time_series
  SCALETYP: linear
  RECORD_VARYING: RV
  FIELDNAM: Quality Flags for HIT L3 electron
  FORMAT: I5
  UNITS: '0: okay; nonzero: caution'
  VALIDMIN: 0
  VALIDMAX: 65534
  FILLVAL: 65535
  LABLAXIS: Quality flags for HIT L3 electron
  VAR_NOTES: >-
    No electron-specific quality flags are defined. All bits are reserved.
